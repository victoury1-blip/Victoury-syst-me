name: Meta Ads Campaign Analytics Report

on:
  workflow_dispatch:
    inputs:
      lookback:
        description: "Period: a number of days, 'today', or 'max' for lifetime. Leave empty to use config.yaml's default."
        required: false
        default: ""
  schedule:
    - cron: "0 8 * * 1" # every Monday 08:00 UTC — edit or remove as needed

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run campaign analytics report
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_LOOKBACK_DAYS: ${{ inputs.lookback }}
        run: python -m meta_ads.campaign_report
